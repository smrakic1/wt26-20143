<!DOCTYPE html>
<html>

<head>
    <title>Prijava na radionicu</title>
</head>
<body>
    <h1>Prijava na radionicu</h1>

    <form>
        <label for="ime">Ime:</label><br>
        <input type="text" id="ime" name="ime"><br>
        <label for="prezime">Prezime:</label><br>
        <input type="text" id="prezime" name="prezime">
    </form>



    <label for="termini">Izaberite termin:</label>
    <select id="termini" name="termini">
        <option value="t1">13:00</option>
        <option value="t2">13:30</option>
        <option value="t3">14:00</option>
        <option value="t4">14:30</option>
    </select>



    <p>Izaberite radionice (možete više):</p>
    <input type="checkbox" id="html" name="radionice" value="html">
    <label for="html">HTML</label><br>

    <input type="checkbox" id="css" name="radionice" value="css">
    <label for="css">CSS</label><br>

    <input type="checkbox" id="js" name="radionice" value="js">
    <label for="js">JavaScript</label><br>

    <input type="checkbox" id="python" name="radionice" value="python">
    <label for="python">Python</label><br>

    <p>Izaberite predavača:</p>
    <input type="radio" id="html" name="radionice" value="html">
    <label for="html">p1</label><br>

    <input type="radio" id="css" name="radionice" value="css">
    <label for="css">p2</label><br>

    <input type="radio" id="js" name="radionice" value="js">
    <label for="js">p3</label><br>

    <input type="radio" id="python" name="radionice" value="python">
    <label for="python">p3</label><br>

</body>
</html>
